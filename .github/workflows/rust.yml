name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  lints:
    name: Check ${{ matrix.target }}${{ matrix.rustflags }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # - target: wasm32-unknown-unknown
          #   os: ubuntu-latest

          # - target: aarch64-linux-android
          #   os: ubuntu-latest
          # - target: armv7-linux-androideabi
          #   os: ubuntu-latest

          # - target: x86_64-pc-windows-msvc
          #   os: windows-latest
          # - target: x86_64-pc-windows-msvc
          #   os: windows-latest
          #   rustflags: '--cfg dev_tools'

          # - target: x86_64-unknown-linux-gnu
          #   os: ubuntu-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            rustflags: '--cfg dev_tools'

    steps:
    - uses: actions/checkout@v7
    - name: Install toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
        components: clippy
    - name: Install Linux deps
      if: matrix.target == 'x86_64-unknown-linux-gnu'
      run: sudo apt-get update && sudo apt install -yy libasound2-dev
    # - name: Cache
    #   uses: Swatinem/rust-cache@v2
    #   with:
    #     key: ${{ matrix.target }}-${{ matrix.rustflags }}
    - name: Check
      env:
        RUSTFLAGS: ${{ matrix.rustflags }}
      run: cargo check -vv --target ${{ matrix.target }} --all-features
    - name: Clippy
      env:
        RUSTFLAGS: ${{ matrix.rustflags }}
      run: cargo clippy --target ${{ matrix.target }} --all-features -- -D warnings
    - name: Debug
      if: ${{ always() }}
      run: |
        tree target/debug/build/rogalik_assets-*
        tree target/x86_64-unknown-linux-gnu/debug/build/rogalik_assets-*
      

