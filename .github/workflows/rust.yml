name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  lints:
    name: Check ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: wasm32-unknown-unknown
            os: ubuntu-latest
          - target: aarch64-linux-android
            os: ubuntu-latest
          - target: armv7-linux-androideabi
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
        components: clippy
    - name: Install deps
      run: sudo apt-get update && sudo apt install -yy libasound2-dev
    - name: Cache
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.target }}
    - name: Check
      run: cargo check --target ${{ matrix.target }} --all-features
    - name: Clippy
      run: cargo clippy --target ${{ matrix.target }} --all-features
      

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Install deps
        run: sudo apt-get update && sudo apt install -yy libasound2-dev
      - name: Run tests
        run: cargo test --verbose

  build-examples:
    runs-on: ubuntu-latest
    needs:
      - test
      - lints

    steps:
      - uses: actions/checkout@v7
      - name: Install deps
        run: sudo apt-get update && sudo apt install -yy libasound2-dev
      - name: Basic examples
        run: |
          cd $GITHUB_WORKSPACE/examples/basic
          cargo build --release
      - name: Game examples
        run: |
          cd $GITHUB_WORKSPACE/examples/games
          cargo build --release
